<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealMatrix - Menu</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

    <header>
        <h1>Meal Matrix Restaurant System</h1>
        <nav>
            <a href="#" data-section="home"><i class="fas fa-home"></i> Home</a>
            <a href="#" data-section="about"><i class="fas fa-info-circle"></i> About Us</a>
            <a href="#" data-section="menu"><i class="fas fa-utensils"></i> Menu</a>
            <a href="#" data-section="orders"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="#" data-section="reservation"><i class="fas fa-calendar-alt"></i> Reservation</a>
            <a href="#" data-section="login"><i class="fas fa-sign-in-alt"></i> Login</a>
            <a href="#" data-section="contact"><i class="fas fa-envelope"></i> Contact</a>
        </nav>
    </header>

    <main>
        <section id="menu" class="section">
            <h2>Menu</h2>
            <div class="menu">
                <div class="card">
                    <h3>Burger</h3>
                    <p>Rs.250</p>
                    <button onclick="addToCart(250)">Add</button>
                </div>
                <div class="card">
                    <h3>Momo</h3>
                    <p>Rs.200</p>
                    <button onclick="addToCart(200)">Add</button>
                </div>
                <div class="card">
                    <h3>Coke</h3>
                    <p>Rs.100</p>
                    <button onclick="addToCart(100)">Add</button>
                </div>
                <div class="card">
                    <h3>Pizza</h3>
                    <p>Rs.560</p>
                    <button onclick="addToCart(560)">Add</button>
                </div>
                <div class="card">
                    <h3>C momo</h3>
                    <p>Rs.115</p>
                    <button onclick="addToCart(115)">Add</button>
                </div>
            </div>

            <h3 id="orderTotal">Total: Rs.0</h3>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
