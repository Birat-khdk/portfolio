<!DOCTYPE html>
<html lang="en">
<head>
    <title> design form:using html</title>
</head>
<body>
    <h1> Form Design</h1>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            full name:<br>
            <input type="text" name="fullname" placeholder="Enter your full name"><br><br>
            current city:<br>
            <input type="text" name="city" placeholder="eg.Bhaktapur"><br><br>
            email:<br>
            <input type="email" name="email" placeholder="example@gmail.com"><br><br>
            phone:<br>
            <input type="tel"name="phone" placeholder="+977-98XXXXXXXX"><br><br>
            gender:<br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender"value="female">female<br><br>
            <input type="radio" name="gender"value="other">other<br><br>
            birthday:<br>
            <input type="date" name="bday"><br><br>
            choose car company:
           <select name="company">
    <option value="">-- Select Company --</option>
    <option value="american">American</option>
    <option value="jeep">Jeep</option>
    <option value="ford">Ford</option>
    <option value="tesla">Tesla</option>
    </select>
            Additional information:<br>
            <textarea rows="5" cols="30"></textarea>
<br><br>
<input type="checkbox" id="agree">
<label for="agree">I agree to the terms and conditions</label><br><br>

<input type="submit" value="Submit">
<input type="reset" value="Reset">

            </fieldset>
            </form>
            </body>
            </html>
